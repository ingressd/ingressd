# CI for pull requests to main, pushes to the release branch and manual runs
# (Actions -> ci -> Run workflow, on any branch).
#
# Pull requests run only what a change affects (scripts/ci-plan.sh); they
# use no secrets, restore but never save caches, and never use
# pull_request_target. A green push to release runs release.yml: tags
# vX.Y.Z from VERSION, builds, signs and publishes the release and the
# container images. The two aggregate checks are `checks (all)` and
# `e2e (all suites)`. See docs/TESTING.md, docs/RELEASING.md and
# docs/CI-SECURITY.md.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [release]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/release' }}

env:
  # Newest Go release with the latest security fixes; go.mod only sets the
  # minimum. govulncheck reports standard-library issues of this version.
  GO_VERSION: stable
  GOLANGCI_LINT_VERSION: v2.15.0
  # Caches are saved on pushes and the nightly run; pull requests restore
  # the base branch's.
  SAVE_CACHE: ${{ github.event_name != 'pull_request' }}

jobs:
  plan:
    name: plan
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.plan.outputs.full }}
      go: ${{ steps.plan.outputs.go }}
      go_pkgs: ${{ steps.plan.outputs.go_pkgs }}
      edge: ${{ steps.plan.outputs.edge }}
      edge_pkgs: ${{ steps.plan.outputs.edge_pkgs }}
      deps: ${{ steps.plan.outputs.deps }}
      docker: ${{ steps.plan.outputs.docker }}
      suites: ${{ steps.plan.outputs.suites }}
      e2e: ${{ steps.plan.outputs.e2e }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # merge base with the PR base
      - uses: ./.github/actions/go-cache
        with:
          name: plan
          go-version: ${{ env.GO_VERSION }}
      - id: plan
        run: ./scripts/ci-plan.sh

  control:
    name: control plane + connector
    permissions:
      contents: read
    needs: plan
    if: needs.plan.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: go
        uses: ./.github/actions/go-cache
        with:
          name: test-race
          go-version: ${{ env.GO_VERSION }}
      - if: needs.plan.outputs.deps == 'true'
        run: go mod verify
      - run: |
          # shellcheck disable=SC2086 # a package list
          go vet $PKGS
        env:
          PKGS: ${{ needs.plan.outputs.go_pkgs }}
      - run: |
          # shellcheck disable=SC2086 # a package list
          go test -race $PKGS
        env:
          CGO_ENABLED: "1"
          PKGS: ${{ needs.plan.outputs.go_pkgs }}
      - if: env.SAVE_CACHE == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.go.outputs.paths }}
          key: ${{ steps.go.outputs.key }}

  edge:
    name: edge (custom Caddy)
    permissions:
      contents: read
    needs: plan
    if: needs.plan.outputs.edge == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: go
        uses: ./.github/actions/go-cache
        with:
          name: edge-test-race
          go-version: ${{ env.GO_VERSION }}
      - if: needs.plan.outputs.deps == 'true'
        working-directory: edge
        run: go mod verify
      - working-directory: edge
        run: |
          # shellcheck disable=SC2086 # a package list
          go vet $PKGS
        env:
          PKGS: ${{ needs.plan.outputs.edge_pkgs }}
      - working-directory: edge
        run: |
          # shellcheck disable=SC2086 # a package list
          go test -race $PKGS
        env:
          CGO_ENABLED: "1"
          PKGS: ${{ needs.plan.outputs.edge_pkgs }}
      - if: env.SAVE_CACHE == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.go.outputs.paths }}
          key: ${{ steps.go.outputs.key }}

  # The binaries, built once: the e2e jobs download them.
  build:
    name: build
    permissions:
      contents: read
    needs: plan
    if: needs.plan.outputs.go == 'true' || needs.plan.outputs.edge == 'true' || needs.plan.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: go
        uses: ./.github/actions/go-cache
        with:
          name: build
          go-version: ${{ env.GO_VERSION }}
      - run: make build-e2e
      - run: ./scripts/check-edge-modules.sh bin/ingressd-edge
      - run: bin/ingressd validate -f examples/config.yaml
      - run: ls -lh bin/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-bin
          path: bin/
          retention-days: 3
      - if: env.SAVE_CACHE == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.go.outputs.paths }}
          key: ${{ steps.go.outputs.key }}

  lint:
    permissions:
      contents: read
    needs: plan
    if: needs.plan.outputs.go == 'true' || needs.plan.outputs.edge == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # new issues are those since the merge base with main
      - id: go
        uses: ./.github/actions/go-cache
        with:
          name: lint
          go-version: ${{ env.GO_VERSION }}
      # Built with the Go above (a prebuilt binary older than go.mod's Go
      # refuses to run). Existing code predates the current linter set, so
      # only issues introduced since the merge base with main fail the job
      # (on main itself that is nothing: PRs are the gate).
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          install-mode: goinstall
          args: --new-from-merge-base=origin/main
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          install-mode: goinstall
          args: --new-from-merge-base=origin/main
          working-directory: edge
      - if: env.SAVE_CACHE == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.go.outputs.paths }}
          key: ${{ steps.go.outputs.key }}

  # Pull requests only when dependencies change; every push and nightly
  # (new advisories appear without any change here).
  vuln:
    permissions:
      contents: read
    needs: plan
    if: needs.plan.outputs.deps == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/go-cache
        with:
          name: vuln
          go-version: ${{ env.GO_VERSION }}
      - run: make vuln

  scripts:
    name: workflows + shell scripts
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: shellcheck
        run: |
          shellcheck -s sh deploy/install-connector.sh
          shellcheck deploy/install.sh deploy/docker/node-entrypoint.sh scripts/*.sh
          shellcheck -x test/netns/lib.sh

  connector:
    name: connector ${{ matrix.goos }}/${{ matrix.goarch }}
    permissions:
      contents: read
    needs: plan
    if: needs.plan.outputs.go == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: go
        uses: ./.github/actions/go-cache
        with:
          name: connector-${{ matrix.goos }}-${{ matrix.goarch }}
          go-version: ${{ env.GO_VERSION }}
      - run: make build-connectors CONNECTOR_PLATFORMS=${{ matrix.goos }}/${{ matrix.goarch }}
      - run: ls -lh bin/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ingressd-connector_${{ matrix.goos }}_${{ matrix.goarch }}
          path: bin/ingressd-connector_*
          retention-days: 7
      - if: env.SAVE_CACHE == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.go.outputs.paths }}
          key: ${{ steps.go.outputs.key }}

  e2e:
    name: e2e ${{ matrix.suite }}
    permissions:
      contents: read
    needs: [plan, build]
    if: needs.plan.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.plan.outputs.suites) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-bin
          path: bin
      - run: chmod +x bin/*
      - run: ./scripts/ci-netns-setup.sh
      - run: ./scripts/e2e.sh --no-build "$SUITE"
        env:
          SUITE: ${{ matrix.suite }}
          E2E_OUT: ${{ runner.temp }}/e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-logs-${{ matrix.suite }}
          path: ${{ runner.temp }}/e2e/*.log
          retention-days: 7

  # --- Required checks: one stable name per lane, whatever the plan ran. -----
  # A job the plan skipped counts as passed; a failed or cancelled one fails.
  checks:
    name: checks (all)
    permissions: {}
    if: always()
    needs: [plan, control, edge, build, lint, vuln, scripts, connector]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success" or .result == "skipped") and .plan.result == "success"' >/dev/null

  e2e-result:
    name: e2e (all suites)
    permissions: {}
    if: always()
    needs: [plan, build, e2e]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
          SUITES: ${{ needs.plan.outputs.suites }}
        run: |
          echo "suites: $SUITES"
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success" or .result == "skipped") and .plan.result == "success"' >/dev/null

  # --- Ship a green release push (release.yml). --------------------------------
  release:
    name: release
    needs: [checks, e2e-result]
    if: github.event_name == 'push' && github.ref == 'refs/heads/release'
    # The called jobs ask for no more than this. Signing and panel secrets come
    # only from the release-signing and release-publish environments.
    permissions:
      contents: write # tag and GitHub release
      packages: write # container images
      id-token: write # cosign keyless signing, build provenance
      attestations: write # build provenance attestations
    uses: ./.github/workflows/release.yml
    secrets: inherit
