# Ships a release. Called by ci.yml after a green push to the release branch
# (or run by hand on release to rebuild). Jobs, each with only what it needs:
#
#   build    no secrets, no Go cache: builds dist/ (scripts/build-release.sh)
#            and releasetool, uploads them as one tarball and outputs its
#            sha256
#   attest   build provenance (Sigstore) for the binaries in dist/
#   sign     environment release-signing (MINISIGN_SECRET_KEY): checks the
#            tarball digest, signs release.json and SHA256SUMS with minisign
#            and verifies them with the key built into the code; runs no Go
#            toolchain
#   publish  tags vX.Y.Z and publishes the GitHub release
#   panel    environment release-publish (PANEL_HOST_*): hands the release
#            to the hosted panel's download mirror
#   images   container images with SBOM and provenance, signed with cosign
#            (keyless)
#
# VERSION holds the version the next release will have; bump it on main right
# after a release. Commit message trailers since the previous release set
# manifest fields:
#   Security: yes             the release fixes a security issue
#   Min-Supported: v1.2.0     oldest version still supported
# See docs/RELEASING.md and docs/CI-SECURITY.md.
name: release

on:
  # No declared secrets: a declared secret the caller does not pass hides the
  # environment secret of the same name. ci.yml passes secrets: inherit.
  workflow_call:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  GO_VERSION: stable

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      prev: ${{ steps.version.outputs.prev }}
      digest: ${{ steps.pack.outputs.digest }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Version
        id: version
        run: |
          [ "$GITHUB_REF_NAME" = release ] || { echo "::error::releases are built from the release branch, not $GITHUB_REF_NAME"; exit 1; }
          v=$(tr -d ' \r\n' <VERSION)
          [[ $v =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]] || { echo "::error::VERSION must be X.Y.Z, got '$v'"; exit 1; }
          if existing=$(git rev-parse -q --verify "refs/tags/v$v^{commit}"); then
            if [ "$existing" != "$(git rev-parse HEAD)" ]; then
              echo "::error::v$v was released from $existing, not this commit: bump VERSION"; exit 1
            fi
          fi
          tag=v$v
          prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-*' HEAD^ 2>/dev/null || true)
          range=${prev:+$prev..}HEAD
          msgs=$(git log --format=%B "$range")
          security=false
          grep -qiE '^security:[[:space:]]*(yes|true|1)[[:space:]]*$' <<<"$msgs" && security=true
          min=$(sed -nE 's/^[Mm]in-[Ss]upported:[[:space:]]*(v[0-9][^[:space:]]*).*/\1/p' <<<"$msgs" | sort -V | tail -1)
          { echo "tag=$tag"; echo "security=$security"; echo "min_supported=$min"; echo "prev=$prev"; } >>"$GITHUB_OUTPUT"
          echo "### $tag" >>"$GITHUB_STEP_SUMMARY"
          echo "security=$security min_supported=${min:-none} previous release=${prev:-none}" >>"$GITHUB_STEP_SUMMARY"
      # Release builds never restore or save a cache: a poisoned cache must
      # not be able to reach signed binaries.
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: false
      - name: Build binaries and release.json
        env:
          VERSION: ${{ steps.version.outputs.tag }}
          SECURITY: ${{ steps.version.outputs.security }}
          MIN_SUPPORTED: ${{ steps.version.outputs.min_supported }}
          NOTES_URL: https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.tag }}
        run: COMMIT="$(git rev-parse --short HEAD)" ./scripts/build-release.sh dist
      # The sign job verifies with this binary, so it needs no Go toolchain
      # and no checkout.
      - name: Build releasetool
        run: CGO_ENABLED=0 go build -trimpath -o tools/releasetool ./scripts/releasetool
      - name: Pack
        id: pack
        run: |
          tar -cf "$RUNNER_TEMP/release-build.tar" dist tools/releasetool
          digest=$(sha256sum "$RUNNER_TEMP/release-build.tar" | cut -d' ' -f1)
          echo "digest=$digest" >>"$GITHUB_OUTPUT"
          echo "release-build.tar sha256 $digest" >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-build-${{ steps.version.outputs.tag }}
          path: ${{ runner.temp }}/release-build.tar
          retention-days: 7
          if-no-files-found: error

  # GitHub stores attestations for private repositories only on paid plans:
  # skipped until the repository is public (publish accepts the skip).
  attest:
    name: build provenance
    needs: build
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Sigstore certificate
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-build-${{ needs.build.outputs.tag }}
          path: ${{ runner.temp }}/in
      - name: Check the digest and unpack
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          echo "$DIGEST  $RUNNER_TEMP/in/release-build.tar" | sha256sum -c -
          tar -xf "$RUNNER_TEMP/in/release-build.tar"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/ingressd*

  sign:
    name: sign
    needs: build
    runs-on: ubuntu-latest
    environment: release-signing
    permissions: {}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-build-${{ needs.build.outputs.tag }}
          path: ${{ runner.temp }}/in
      - name: Check the digest and unpack
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          echo "$DIGEST  $RUNNER_TEMP/in/release-build.tar" | sha256sum -c -
          tar -xf "$RUNNER_TEMP/in/release-build.tar"
      # A pinned upstream build, checked against its SHA-256 (verified once
      # against the author's minisign key RWQf6LRC…GFO3): no package manager
      # or mirror runs in the job that holds the signing key.
      - name: Install minisign
        env:
          MINISIGN_URL: https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-linux.tar.gz
          MINISIGN_SHA256: 9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73
        run: |
          curl -fsSL --proto '=https' -o "$RUNNER_TEMP/minisign.tar.gz" "$MINISIGN_URL"
          echo "$MINISIGN_SHA256  $RUNNER_TEMP/minisign.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/minisign.tar.gz" -C "$RUNNER_TEMP/bin" --strip-components=2 minisign-linux/x86_64/minisign
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
      # Without the signature no node, connector or panel accepts the
      # release; releasetool checks it against pkg/release.ReleasePublicKey.
      - name: Sign release.json and SHA256SUMS
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          [ -n "$MINISIGN_SECRET_KEY" ] || { echo "::error::MINISIGN_SECRET_KEY is not set in the release-signing environment"; exit 1; }
          umask 077
          printf '%s\n' "$MINISIGN_SECRET_KEY" >"$RUNNER_TEMP/minisign.key"
          minisign -S -s "$RUNNER_TEMP/minisign.key" -m dist/release.json -x dist/release.json.minisig -t "ingressd $TAG"
          minisign -S -s "$RUNNER_TEMP/minisign.key" -m dist/SHA256SUMS -x dist/SHA256SUMS.minisig -t "ingressd $TAG"
          rm -f "$RUNNER_TEMP/minisign.key"
          ./tools/releasetool verify --dir dist || {
            echo "::error::release.json does not verify with pkg/release.ReleasePublicKey: put the public key of MINISIGN_SECRET_KEY there"; exit 1; }
      - if: always()
        run: rm -f "$RUNNER_TEMP/minisign.key"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ needs.build.outputs.tag }}
          path: dist/
          retention-days: 90
          if-no-files-found: error

  publish:
    name: publish
    needs: [build, attest, sign]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.sign.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.attest.result) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # tag and GitHub release
    steps:
      # Keeps the token: this job pushes the tag.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-${{ needs.build.outputs.tag }}
          path: dist
      - name: Tag and publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          PREV: ${{ needs.build.outputs.prev }}
        run: |
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "ingressd $TAG"
            git push origin "refs/tags/$TAG"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true ]; then
              gh release upload "$TAG" dist/* --clobber
              gh release edit "$TAG" --draft=false --latest
            else
              echo "::notice::release $TAG is already published; its assets are left as they are"
            fi
          else
            gh release create "$TAG" dist/* --verify-tag --latest --generate-notes \
              ${PREV:+--notes-start-tag "$PREV"} --title "ingressd $TAG"
          fi
          echo "GitHub release: $(gh release view "$TAG" --json url --jq .url)" >>"$GITHUB_STEP_SUMMARY"

  # The hosted panel serves releases from its own download mirror (nodes and
  # connectors try it before GitHub). The panel host only lets this key run
  # its artifact upload command.
  panel:
    name: publish to the panel
    needs: [build, publish]
    # A skipped attest job (private repository) would otherwise skip this
    # job too: GitHub skips a job when any job in its chain was skipped.
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    environment: release-publish
    permissions: {}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-${{ needs.build.outputs.tag }}
          path: dist
      - name: Upload to the panel host
        env:
          KEY: ${{ secrets.PANEL_HOST_SSH_KEY }}
          HOST: ${{ secrets.PANEL_HOST }}
          KNOWN_HOSTS: ${{ secrets.PANEL_HOST_KNOWN_HOSTS }}
          TARGET: prod
        run: |
          if [ -z "$KEY" ] || [ -z "$HOST" ] || [ -z "$KNOWN_HOSTS" ]; then
            echo "::error::PANEL_HOST_SSH_KEY, PANEL_HOST and PANEL_HOST_KNOWN_HOSTS must be secrets of the release-publish environment"; exit 1
          fi
          umask 077
          printf '%s\n' "$KEY" >"$RUNNER_TEMP/key"
          printf '%s\n' "$KNOWN_HOSTS" >"$RUNNER_TEMP/known_hosts"
          ssh_() {
            ssh -i "$RUNNER_TEMP/key" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=15 \
              -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" -o StrictHostKeyChecking=yes "$HOST" "$@"
          }
          (cd dist && tar -czf - -- *) | ssh_ artifacts "$TARGET"
          ssh_ status "$TARGET" </dev/null | tee -a "$GITHUB_STEP_SUMMARY"
      - if: always()
        run: rm -f "$RUNNER_TEMP/key" "$RUNNER_TEMP/known_hosts"

  images:
    name: image ${{ matrix.image }}
    needs: [build, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless signing
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: connector, file: Dockerfile.connector, platforms: "linux/amd64,linux/arm64,linux/arm/v7" }
          - { image: node, file: Dockerfile.node, platforms: "linux/amd64,linux/arm64" }
    env:
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.build.outputs.tag }}
          persist-credentials: false
      # ghcr.io/<IMAGE_NAMESPACE>/ingressd-<image>, pushed with the workflow
      # token (or REGISTRY_USERNAME/REGISTRY_PASSWORD for another registry).
      - name: Registry settings
        id: reg
        env:
          REGISTRY: ${{ vars.REGISTRY || 'ghcr.io' }}
          IMAGE_NAMESPACE: ${{ vars.IMAGE_NAMESPACE || 'ingressd' }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          IMAGE: ingressd-${{ matrix.image }}
        run: |
          {
            echo "image=$REGISTRY/$IMAGE_NAMESPACE/$IMAGE"
            echo "registry=$REGISTRY"
            echo "username=${REGISTRY_USERNAME:-$GITHUB_ACTOR}"
          } >>"$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ steps.reg.outputs.registry }}
          username: ${{ steps.reg.outputs.username }}
          password: ${{ secrets.REGISTRY_PASSWORD || github.token }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ steps.reg.outputs.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
          labels: |
            org.opencontainers.image.licenses=Apache-2.0
      # No build cache: release images are built from scratch.
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          build-args: |
            VERSION=${{ env.TAG }}
            COMMIT=${{ github.sha }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image (cosign keyless)
        env:
          IMAGE: ${{ steps.reg.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
