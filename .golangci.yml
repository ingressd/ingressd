version: "2"

linters:
  default: standard
  enable:
    - errorlint
    - gosec
    - misspell
    - unconvert
  exclusions:
    # Unchecked Close/Flush/Fprint* and similar idioms (golangci-lint v1's
    # default exclusions), used throughout the code base.
    presets:
      - std-error-handling
      - common-false-positives

formatters:
  enable:
    - gofmt
    - goimports
